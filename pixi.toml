[workspace]
channels = ["conda-forge"]
description = "Build instructions for FF"
name = "ff"
platforms = ["linux-64", "osx-arm64"]
version = "2.1.0"

# The minimally activated compilers do not set any environment variables
[activation.env]
FC = "gfortran"
FFLAGS = "-O2 -fPIC"
LDFLAGS = "-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"

# Use the archiver from the compiler toolchain rather than requiring one on the system.
# On macOS use the Xcode Command Line Tools archiver.
[target.linux-64.activation.env]
AR = "x86_64-conda-linux-gnu-ar"
RANLIB = "x86_64-conda-linux-gnu-ranlib"

[tasks.build]
description = "Build FF from source out of tree under build/"
cmd = """
mkdir -p build && \
cd build && \
export CPU_COUNT=10 && \
make --jobs=$CPU_COUNT -f ../src/ff/Makefile VPATH=../src/ff FC=$FC FFLAGS="$FFLAGS -std=legacy -ffixed-line-length-none"
"""

[tasks.install]
description = "Install FF under $CONDA_PREFIX"
cmd = """
cd build && \
make -f ../src/ff/Makefile VPATH=../src/ff FC=$FC FFLAGS="$FFLAGS -std=legacy -ffixed-line-length-none" DEST=$CONDA_PREFIX/lib install && \
mkdir -p $CONDA_PREFIX/include/ff && \
cp ../src/ff/*.h $CONDA_PREFIX/include/ff/ && \
mkdir -p $CONDA_PREFIX/share/ff && \
cp ../src/ff/*.dat $CONDA_PREFIX/share/ff/
"""
depends-on = ["build"]

[tasks.test]
description = "Test installed FF with npointes program"
cmd = """
mkdir -p build && \
cd build && \
$FC ../src/ff/npointes.f -o npointes $FFLAGS -I$CONDA_PREFIX/include/ff $LDFLAGS -lff && \
./npointes
"""

[tasks.clean]
description = "Remove the build directory"
cmd = "rm -rf build"

[tasks.start]
description = "Install and test FF"
depends-on = ["install", "test", "clean"]

[dependencies]
cxx-compiler = ">=2.0.0,<3"
fortran-compiler = ">=2.0.0,<3"
make = ">=4.4.1,<5"
